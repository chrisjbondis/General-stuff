name: Deploy to Oracle Cloud

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ORACLE_SSH_KEY }}

      - name: Add Oracle host to known_hosts
        run: ssh-keyscan -H 168.138.23.164 >> ~/.ssh/known_hosts

      - name: Rsync build output to Oracle
        run: |
          rsync -avz --delete \
            out/ ubuntu@168.138.23.164:/var/www/generalstuff.com.au/html/
